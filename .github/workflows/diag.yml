name: diag
on:
  workflow_dispatch:
  push:
permissions:
  id-token: write
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: context
        run: |
          echo CTX_ACTOR=$GITHUB_ACTOR REPO=$GITHUB_REPOSITORY REF=$GITHUB_REF EVENT=$GITHUB_EVENT_NAME
          echo CTX_WORKFLOW_REF=$GITHUB_WORKFLOW_REF RUN_ID=$GITHUB_RUN_ID
          echo CTX_TRIGGERING_ACTOR=$GITHUB_TRIGGERING_ACTOR
      - name: oidc-claims
        run: |
          R=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=poc-audience")
          TOK=$(echo "$R" | python3 -c "import sys,json;print(json.load(sys.stdin)["value"])")
          P=$(echo "$TOK" | cut -d. -f2)
          echo OIDC_CLAIMS_START
          python3 -c "import base64,json;p='$P';p+='='*(-len(p)%4);print(json.dumps(json.loads(base64.urlsafe_b64decode(p)),indent=2))"
          echo OIDC_CLAIMS_END
