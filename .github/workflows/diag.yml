name: diag
on:
  workflow_dispatch:
  push:
permissions:
  id-token: write
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: context
        run: |
          echo "CTX_ACTOR=$GITHUB_ACTOR REPO=$GITHUB_REPOSITORY REF=$GITHUB_REF EVENT=$GITHUB_EVENT_NAME"
          echo "CTX_WORKFLOW_REF=$GITHUB_WORKFLOW_REF"
          echo "CTX_TRIGGERING_ACTOR=$GITHUB_TRIGGERING_ACTOR"
      - name: oidc
        env:
          AUD: poc-audience
        run: |
          set -e
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD" -o /tmp/oidc.json || echo "OIDC_REQUEST_FAILED"
          python3 - <<'PY'
          import json,base64
          try:
              v=json.load(open('/tmp/oidc.json'))['value']
              p=v.split('.')[1]; p+='='*(-len(p)%4)
              claims=json.loads(base64.urlsafe_b64decode(p))
              print("OIDC_CLAIMS_START")
              print(json.dumps(claims,indent=2,sort_keys=True))
              print("OIDC_CLAIMS_END")
          except Exception as e:
              print("OIDC_DECODE_ERR",repr(e))
              print(open('/tmp/oidc.json').read()[:300])
          PY
